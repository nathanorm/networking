[project]
name = "emulator"
version = "0.1.0"
description = "Mock test rig / vehicle sensor: emits framed telemetry over TCP and UDP"
requires-python = ">=3.13"
dependencies = ["edgelab-protocol", "edgelab-common"]

[tool.uv.sources]
edgelab-protocol = { workspace = true }
edgelab-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
