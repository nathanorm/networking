# Workspace root: not a deployable itself, just ties apps/* and shared/* together.
[project]
name = "edgelab"
version = "0.1.0"
requires-python = ">=3.13"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/*", "shared/*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"] # the formatter owns line length

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib -q"
testpaths = ["shared", "apps"]
